<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="flex-container">
    <!-- Conversations Sidebar -->
    <div class="sidebar" id="conversations-sidebar">
      <h2 id="conversations-header" class="text-lg font-bold">
        <img src="/images/conversation-history-icon.png" alt="Conversations" class="icon">
      </h2>
      <div id="conversations-container">
        <div id="conversations" class="space-y-2"></div>
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="main">
      <div class="header">
        <div class="controls">
          <button id="newChat" title="New Chat">
            <img src="/images/new-chat-icon.png" alt="New Chat" class="icon">
          </button>
          <button id="tempChat" title="Temporary Chat">
            <img src="/images/ghost-icon.png" alt="Temporary Chat" class="icon">
          </button>
          <button id="themeToggle" title="Toggle Theme">☀️</button>
        </div>
      </div>
      <div class="content">
        <div id="greeting">
          <div id="salutation"></div>
          <div id="question"></div>
        </div>
        <div class="chat-area">
          <div class="messages" id="messages"></div>
          <div class="input-container">
            <input type="text" id="messageInput" placeholder="What do you want to know?">
            <button id="sendBtn">↑</button>
          </div>
        </div>
      </div>
    </div>

    <!-- News Sidebar -->
    <div class="news-sidebar" id="top-searches-sidebar">
      <h2 id="top-searches-header" class="text-lg font-bold">
        <img src="/images/top-searches-icon.png" alt="Top Searches" class="icon">
      </h2>
      <div id="top-searches-container">
        <div id="top-searches" class="space-y-2"></div>
      </div>
    </div>


    

    <!-- Neuron-Style Synapse Animation Overlay -->
    <div id="synapse-animation" class="synapse-animation" style="display: none;">
      <div class="synapse-container">
        <svg class="synapse-svg" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
          
          <!-- Neuron 1 -->
          <g class="neuron" transform="translate(80,150)">
            <!-- Cell body (soma) -->
            <circle class="neuron-soma" cx="0" cy="0" r="20" fill="#FFD700" />
            
            <!-- Dendrites (branch out from around the soma) -->
            <path class="neuron-dendrite" d="M -20,0 C -40,-10, -40,-30, -30,-40" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-dendrite" d="M 0,-20 C -10,-30, -20,-40, -10,-50" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-dendrite" d="M 0,20 C -10,30, -20,40, -10,50" fill="none" stroke="#FFD700" stroke-width="2"/>
            
            <!-- Axon (extends to the right, with small branches at the tip) -->
            <path class="neuron-axon" d="M 20,0 C 40,0, 60,-10, 80,-5" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 80,-5 C 90,-15, 100,-5, 110,-10" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 80,-5 C 90,5, 100,15, 110,10" fill="none" stroke="#FFD700" stroke-width="2"/>
          </g>
          
          <!-- Neuron 2 -->
          <g class="neuron" transform="translate(230,150)">
            <circle class="neuron-soma" cx="0" cy="0" r="20" fill="#FFD700" />
            <path class="neuron-dendrite" d="M -20,0 C -40,-10, -40,-30, -30,-40" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-dendrite" d="M 0,-20 C -10,-30, -20,-40, -10,-50" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-dendrite" d="M 0,20 C -10,30, -20,40, -10,50" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 20,0 C 40,0, 60,-10, 80,-5" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 80,-5 C 90,-15, 100,-5, 110,-10" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 80,-5 C 90,5, 100,15, 110,10" fill="none" stroke="#FFD700" stroke-width="2"/>
          </g>
          
          <!-- Neuron 3 -->
          <g class="neuron" transform="translate(380,150)">
            <circle class="neuron-soma" cx="0" cy="0" r="20" fill="#FFD700" />
            <path class="neuron-dendrite" d="M -20,0 C -40,-10, -40,-30, -30,-40" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-dendrite" d="M 0,-20 C -10,-30, -20,-40, -10,-50" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-dendrite" d="M 0,20 C -10,30, -20,40, -10,50" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 20,0 C 40,0, 60,-10, 80,-5" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 80,-5 C 90,-15, 100,-5, 110,-10" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 80,-5 C 90,5, 100,15, 110,10" fill="none" stroke="#FFD700" stroke-width="2"/>
          </g>
          
          <!-- Neuron 4 -->
          <g class="neuron" transform="translate(530,150)">
            <circle class="neuron-soma" cx="0" cy="0" r="20" fill="#FFD700" />
            <path class="neuron-dendrite" d="M -20,0 C -40,-10, -40,-30, -30,-40" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-dendrite" d="M 0,-20 C -10,-30, -20,-40, -10,-50" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-dendrite" d="M 0,20 C -10,30, -20,40, -10,50" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 20,0 C 40,0, 60,-10, 80,-5" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 80,-5 C 90,-15, 100,-5, 110,-10" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 80,-5 C 90,5, 100,15, 110,10" fill="none" stroke="#FFD700" stroke-width="2"/>
          </g>
          
          <!-- Neuron 5 -->
          <g class="neuron" transform="translate(680,150)">
            <circle class="neuron-soma" cx="0" cy="0" r="20" fill="#FFD700" />
            <path class="neuron-dendrite" d="M -20,0 C -40,-10, -40,-30, -30,-40" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-dendrite" d="M 0,-20 C -10,-30, -20,-40, -10,-50" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-dendrite" d="M 0,20 C -10,30, -20,40, -10,50" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 20,0 C 40,0, 60,-10, 80,-5" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 80,-5 C 90,-15, 100,-5, 110,-10" fill="none" stroke="#FFD700" stroke-width="2"/>
            <path class="neuron-axon" d="M 80,-5 C 90,5, 100,15, 110,10" fill="none" stroke="#FFD700" stroke-width="2"/>
          </g>
          
        </svg>
        
        <div class="synapse-text">Currently forming a Synapse..</div>
      </div>
    </div>





  </div>
  <script src="/script.js"></script>
</body>
</html>
